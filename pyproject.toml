[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-detect"
version = "0.1.0"
description = "Person detection with SSDLite, OpenCV, ONNX, and a browser demo."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "naveecode" }]
keywords = ["object-detection", "opencv", "pytorch", "onnx"]
classifiers = [
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "pillow>=10",
  "onnxruntime>=1.18",
]

[project.optional-dependencies]
train = [
  "torch>=2.2",
  "torchvision>=0.17",
  "albumentations>=1.4,<2",
  "onnx>=1.16",
  "torchmetrics>=1.4",
  "pycocotools>=2.0.8",
  "ijson>=3.2",
]
api = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "httpx>=0.27",
]

[project.scripts]
vision-detect = "vision_detect.__main__:main"

[tool.setuptools.packages.find]
include = ["vision_detect*"]

[tool.setuptools.package-data]
vision_detect = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
filterwarnings = [
  "ignore:A new version of Albumentations:UserWarning",
  "ignore:Using `httpx` with `starlette.testclient`:Warning",
  "ignore:You are using the legacy TorchScript-based ONNX export:DeprecationWarning",
  "ignore:The feature will be removed:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "data", "outputs", "web", "notebooks", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI uses File() and Query() as argument defaults.
"vision_detect/api/app.py" = ["B008"]
