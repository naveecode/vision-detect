name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Install project
        run: python -m pip install -e ".[train,api,dev]"
      - name: Confirm the CPU wheel stayed installed
        run: python -c "import torch; print(torch.__version__); assert '+cpu' in torch.__version__"
      - name: Lint
        run: ruff check .
      - name: Test
        env:
          NO_ALBUMENTATIONS_UPDATE: "1"
        run: pytest -q
