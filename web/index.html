<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>vision-detect · person detection in the browser</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230c6b58'/%3E%3Crect x='7' y='8' width='18' height='16' fill='none' stroke='white' stroke-width='2'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.30.0/dist/ort.min.js"></script>
  </head>
  <body>
    <header class="site-header">
      <div>
        <p class="eyebrow">vision-detect</p>
        <h1>Person detection, in the browser</h1>
      </div>
      <a class="repo" href="https://github.com/naveecode/vision-detect">Source</a>
    </header>
    <main>
      <section class="stage-card">
        <canvas id="stage" width="640" height="480" aria-label="Detection preview"></canvas>
        <p id="status" class="status" role="status">Loading the ONNX model…</p>
      </section>
      <section class="panel">
        <label class="upload">
          <input id="file" type="file" accept="image/*" />
          <span>Upload a photo</span>
        </label>
        <div id="samples" class="samples" aria-label="Sample photos"></div>
        <label class="threshold" for="threshold">
          Score threshold <strong id="threshold-value">0.40</strong>
        </label>
        <input id="threshold" type="range" min="0.05" max="0.9" step="0.01" value="0.4" />
        <dl class="metrics">
          <div><dt>Detections</dt><dd id="count">—</dd></div>
          <div><dt>Inference</dt><dd id="latency">—</dd></div>
          <div><dt>Model</dt><dd id="model">—</dd></div>
        </dl>
        <p class="note">
          The photo never leaves this page. SSDLite MobileNetV3 runs with
          onnxruntime-web, then the same score threshold and NMS as the Python API.
        </p>
      </section>
    </main>
    <footer>
      <p id="credit"></p>
    </footer>
    <script src="app.js"></script>
  </body>
</html>
